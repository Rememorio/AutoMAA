name: 功能建议
description: 提议通用、可维护的 AutoMAA 改进
title: "feat: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 请描述现在遇到的具体问题，而不只是期望的按钮或实现。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明它如何适用于不同用户、客户端与账号，而非单一私人流程。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: checkboxes
    id: boundaries
    attributes:
      label: 产品边界
      options:
        - label: 该建议不要求 AutoMAA 保存密码、验证码或绕过游戏登录与更新。
          required: true
        - label: 该建议属于 MAA 工作流编排，而不是重新实现 MaaCore 的识别能力。
          required: true
